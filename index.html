<style>
:root{
  --bg:#000; --fg:#fff; --mut:#8f8f8f; --dim:#5c5c5c;
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.26);
  --glass:linear-gradient(165deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.025) 38%,rgba(255,255,255,.015) 62%,rgba(255,255,255,.07) 100%);
  --chrome:linear-gradient(180deg,#fff 0%,#e9e9e9 48%,#c4c4c4 52%,#e2e2e2 100%);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{
  min-height:100vh;color:var(--fg);line-height:1.8;
  font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%,rgba(255,255,255,.17),transparent 70%),
    radial-gradient(ellipse 60% 30% at 50% 108%,rgba(255,255,255,.07),transparent 70%),
    #000;
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
main{width:min(100% - 32px,860px);margin:0 auto;padding:48px 0 72px}

/* ---------- الهيدر ---------- */
.hero{text-align:center;padding:8px 8px 52px}
.logo{
  width:104px;height:104px;object-fit:cover;border-radius:50%;display:block;margin:0 auto;
  border:1px solid var(--line2);
  box-shadow:0 0 0 6px rgba(255,255,255,.03),0 18px 50px rgba(255,255,255,.08);
  -webkit-box-reflect:below 3px linear-gradient(transparent 55%,rgba(255,255,255,.28));
}
.eyebrow{margin-top:34px;font-size:11px;letter-spacing:6px;color:var(--mut);font-weight:500;text-transform:uppercase}
.hero h1{
  font-size:clamp(28px,5.4vw,44px);font-weight:700;line-height:1.35;margin:8px 0 10px;
  background:linear-gradient(180deg,#fff 20%,#9a9a9a 60%,#e8e8e8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--mut);font-size:15px;font-weight:300}

/* ---------- اللوحة الزجاجية ---------- */
.panel{
  position:relative;overflow:hidden;isolation:isolate;
  background:var(--glass);
  border:1px solid var(--line);border-radius:22px;
  padding:clamp(20px,4vw,34px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 40px 90px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.panel::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.07) 42%,rgba(255,255,255,.015) 52%,transparent 62%);
}
h2{font-size:19px;font-weight:700;margin-bottom:2px}
.lead{color:var(--mut);font-size:14px;font-weight:300;margin-bottom:22px}

.formline{display:flex;gap:10px;flex-wrap:wrap}
input{
  flex:1 1 260px;min-width:0;direction:ltr;text-align:left;font:inherit;font-size:15px;color:var(--fg);
  background:rgba(0,0,0,.6);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;outline:none;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.7);transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:var(--dim)}
input:focus{border-color:#fff;box-shadow:inset 0 2px 8px rgba(0,0,0,.7),0 0 0 3px rgba(255,255,255,.12)}

/* ---------- الأزرار (كروم) ---------- */
.btn,.mini{
  position:relative;overflow:hidden;cursor:pointer;border:0;text-decoration:none;font-family:inherit;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--chrome);color:#000;font-weight:700;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25),0 6px 22px rgba(255,255,255,.1);
  transition:transform .15s,box-shadow .2s;
}
.btn::after,.mini::after{
  content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-18deg);
}
.btn:hover::after,.mini:hover::after{left:130%;transition:left .65s ease}
.btn:hover,.mini:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25),0 10px 30px rgba(255,255,255,.2)}
.btn:active,.mini:active{transform:translateY(0)}
.btn{padding:13px 26px;border-radius:12px;font-size:15px}
.mini{padding:9px 16px;border-radius:10px;font-size:13px}
.mini.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.mini.ghost::after{display:none}
.btn:focus-visible,.mini:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:wait}

#st{min-height:26px;margin-top:14px;font-size:14px;color:var(--mut)}
#st.bad{color:#fff;border-right:2px solid #fff;padding-right:10px}

/* ---------- النتائج ---------- */
#out:empty{display:none}
#out{margin-top:6px}
.movie-head{display:flex;align-items:center;gap:20px;padding:22px 0 10px;border-top:1px solid var(--line);margin-top:14px}
.poster{
  width:104px;height:150px;object-fit:cover;border-radius:12px;flex-shrink:0;background:#0b0b0b;
  border:1px solid var(--line2);filter:grayscale(1) contrast(1.05);
  -webkit-box-reflect:below 2px linear-gradient(transparent 62%,rgba(255,255,255,.22));
  margin-bottom:24px;
}
.poster-placeholder{display:grid;place-items:center;color:var(--dim);font-size:12px;text-align:center}
.movie-kicker{font-size:11px;letter-spacing:3px;color:var(--mut);margin-bottom:4px}
.movie-name{font-size:clamp(20px,3.2vw,27px);font-weight:700;line-height:1.45;overflow-wrap:anywhere;direction:auto}
.pill{display:inline-block;margin-top:8px;padding:2px 12px;border:1px solid var(--line2);border-radius:99px;font-size:11px;color:var(--mut);letter-spacing:2px}

.group{margin-top:22px}
.group h3{font-size:13px;font-weight:500;color:var(--mut);letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.group h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.card{
  position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-width:0;
  padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(170deg,rgba(255,255,255,.08),rgba(255,255,255,.015) 55%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  transition:border-color .2s,transform .2s;
}
.card:hover{border-color:var(--line2)}
.label{font-weight:700;font-size:17px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:1px 8px;border-radius:6px;background:#fff;color:#000}
.sub{font-size:12px;color:var(--mut);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar[hidden]{display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#aaa,#fff);transition:width .2s}
.note{margin-top:20px;color:var(--dim);font-size:12px;text-align:center}
footer{margin-top:34px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.3px}

@media(max-width:520px){
  main{width:min(100% - 20px,860px);padding-top:26px}
  .formline{display:grid}
  .btn{width:100%}
  .movie-head{gap:14px}
  .poster{width:86px;height:124px}
  .list{grid-template-columns:1fr}
  .panel{border-radius:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.btn::after,.mini::after{display:none}}
</style>
</head>
<body>

const API = "https://cinemana.shabakaty.cc/api/android/";
const EXT = u => ((u.split(/[?#]/)[0].match(/\.([a-z0-9]{2,4})$/i) || [])[1] || "").toLowerCase();
const VID_EXT = ["mp4", "mkv", "webm", "mov", "m4v"];
const SUB_EXT = ["vtt", "srt", "ass"];
const LANGS = { ar: "عربي", en: "إنجليزي", fr: "فرنسي", tr: "تركي", es: "إسباني", de: "ألماني", fa: "فارسي", ku: "كردي", ru: "روسي", it: "إيطالي", ko: "كوري", hi: "هندي" };
const LANG_ALIAS = { arabic: "ar", "عربي": "ar", "العربية": "ar", english: "en", "إنجليزي": "en", "انجليزي": "en", french: "fr", "فرنسي": "fr", turkish: "tr", spanish: "es", german: "de", persian: "fa", kurdish: "ku", russian: "ru", italian: "it", korean: "ko", hindi: "hi" };
const normLang = s => { s = String(s || "").trim().toLowerCase(); return LANGS[s] ? s : LANG_ALIAS[s] || ""; };

// يسحب كل الروابط من الرد مهما كانت أسماء الحقول
function urlsIn(json, text) {
  const out = [];
  const add = (s, obj, key) => {
    s = s.trim().replace(/^\/\//, "https://");
    if (/^https?:\/\/\S+$/i.test(s)) out.push({ url: s, obj, key: key || "" });
  };
  if (json === undefined) {
    (text.replace(/\\\//g, "/").replace(/\\u0026/g, "&").match(/https?:\/\/[^\s"'\\<>]+/g) || []).forEach(s => add(s, null, ""));
    return out;
  }
  (function walk(n, parent, key) {
    if (typeof n === "string") add(n, parent, key);
    else if (Array.isArray(n)) n.forEach(x => walk(x, parent, key));
    else if (n && typeof n === "object") Object.entries(n).forEach(([k, x]) => walk(x, n, k));
  })(json, null, "");
  return out;
}

function hint(obj, re) {
  if (!obj) return "";
  for (const [k, v] of Object.entries(obj)) {
    if (re.test(k) && (typeof v === "string" || typeof v === "number") && String(v).length < 24 && !/^https?:/i.test(String(v))) return String(v);
  }
  return "";
}

/* ---- التعرف على الدقة: 4K / 2K / 1080p ... ---- */
function parseRes(s) {
  s = String(s);
  let m = s.match(/(\d{3,4})\s*[x×*]\s*(\d{3,4})/);
  if (m) return { w: +m[1], h: +m[2] };
  if (/(?:^|[^a-z0-9])(?:4k|uhd)(?![a-z0-9])/i.test(s)) return { h: 2160 };
  if (/(?:^|[^a-z0-9])(?:2k|qhd)(?![a-z0-9])/i.test(s)) return { h: 1440 };
  m = s.match(/(?:^|[^a-z0-9])(\d{3,4})p(?![a-z0-9])/i);
  if (m) return { h: +m[1] };
  return null;
}

function resOf(url, obj, key) {
  if (obj) {
    const H = +obj.height, W = +obj.width;
    if (H >= 240 || W >= 320) return { w: W || 0, h: H || 0 };
    for (const [k, v] of Object.entries(obj)) {
      if (typeof v !== "string" && typeof v !== "number") continue;
      const sv = String(v);
      if (/^https?:|^\/\//i.test(sv) || sv.length > 40) continue;
      const r = parseRes(sv);
      if (r) return r;
      if (/height|res|qual/i.test(k) && /^\d{3,4}$/.test(sv) && +sv >= 240 && +sv <= 4400) return { h: +sv };
    }
  }
  const rk = key && parseRes(key);
  if (rk) return rk;
  const path = url.split(/[?#]/)[0];
  const ru = parseRes(path);
  if (ru) return ru;
  const b = path.match(/[\/_.\-](2160|1440|1080|720|480|360)(?=[\/_.\-]|$)/);
  return b ? { h: +b[1] } : null;
}

function tierOf(r) {
  if (!r) return { n: 0, label: "جودة غير محددة", sub: "", tag: "" };
  const H = r.h || 0, W = r.w || 0;
  const th = H >= 2000 ? 2160 : H >= 1300 ? 1440 : H >= 1000 ? 1080 : H >= 680 ? 720 : H >= 460 ? 480 : H > 0 ? 360 : 0;
  const tw = W >= 3400 ? 2160 : W >= 2400 ? 1440 : W >= 1800 ? 1080 : W >= 1200 ? 720 : W >= 800 ? 480 : W > 0 ? 360 : 0;
  const n = Math.max(th, tw);
  if (!n) return { n: 0, label: "جودة غير محددة", sub: "", tag: "" };
  if (n >= 2160) return { n, label: "4K", sub: "2160p · UHD", tag: "UHD" };
  if (n >= 1440) return { n, label: "2K", sub: "1440p · QHD", tag: "QHD" };
  return { n, label: n + "p", sub: n >= 1080 ? "Full HD" : n >= 720 ? "HD" : "", tag: "" };
}

function classify(items) {
  const seen = new Set(), vids = [], subs = [];
  let hls = 0;
  for (const { url, obj, key } of items) {
    const k = url.split("?")[0];
    if (seen.has(k)) continue;
    const e = EXT(url);
    if (VID_EXT.includes(e)) {
      seen.add(k);
      vids.push({ url, ext: e, ...tierOf(resOf(url, obj, key)) });
    } else if (SUB_EXT.includes(e)) {
      seen.add(k);
      const raw = hint(obj, /lang|name|label/i);
      const code = ((url.match(/_([a-z]{2})_transfile/i) || [])[1] || "").toLowerCase() || normLang(raw);
      subs.push({ url, ext: e, code, lang: LANGS[code] || raw || "ترجمة" });
    } else if (e === "m3u8") hls++;
  }
  // شيل الجودات المتشابهة: وحدة بس لكل دقة (يفضّل mp4)
  vids.sort((a, b) => b.n - a.n || (b.ext === "mp4") - (a.ext === "mp4"));
  const vSeen = new Set();
  const videos = vids.filter(v => { if (!v.n) return true; if (vSeen.has(v.n)) return false; vSeen.add(v.n); return true; });
  // شيل الترجمات المتشابهة: وحدة بس لكل لغة (يفضّل vtt ثم srt)
  const rank = e => ({ vtt: 0, srt: 1, ass: 2 }[e]);
  const order = c => ({ ar: 0, en: 1 }[c] ?? 2);
  subs.sort((a, b) => order(a.code) - order(b.code) || rank(a.ext) - rank(b.ext));
  const sSeen = new Set();
  const subtitles = subs.filter(s => { const k = s.code || (s.lang !== "ترجمة" ? s.lang.toLowerCase() : s.url); if (sSeen.has(k)) return false; sSeen.add(k); return true; });
  return { videos, subs: subtitles, hls };
}

function findTitle(json) {
  const o = Array.isArray(json) ? json[0] : json;
  if (!o || typeof o !== "object") return "";
  for (const k of ["en_title", "title", "otitle", "ar_title"]) if (typeof o[k] === "string" && o[k].trim()) return o[k].trim();
  const k = Object.keys(o).find(k => /title/i.test(k) && typeof o[k] === "string" && o[k].trim());
  return k ? o[k].trim() : "";
}

function findPoster(json) {
  const keys = /poster|cover|thumbnail|image|pic|thumb/i;
  let found = "";
  (function walk(n, depth = 0) {
    if (!n || typeof n !== "object" || depth > 5 || found) return;
    for (const [k, v] of Object.entries(n)) {
      if (typeof v === "string" && keys.test(k) && /^https?:\/\//i.test(v) && /\.(jpg|jpeg|png|webp)([?#]|$)/i.test(v)) { found = v; return; }
      if (v && typeof v === "object") walk(v, depth + 1);
    }
  })(json);
  return found;
}

const el = (t, p = {}, ...c) => { const e = Object.assign(document.createElement(t), p); c.forEach(x => e.append(x)); return e; };
const status = (msg, bad) => { $("st").textContent = msg; $("st").className = bad ? "bad" : ""; };
const mb = n => (n / 1048576).toFixed(n > 1073741824 ? 0 : 1) + " MB";

async function grab(name, id) {
  const r = await fetch(API + name + "/id/" + id);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const text = await r.text();
  let json; try { json = JSON.parse(text); } catch (e) {}
  return { text, json };
}

function saveBlob(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// لما المتصفح يمنع التسمية: نحمّل الرابط مباشرة وننسخ الاسم للحافظة
function fallbackOpen(url, name, err) {
  if (PROXY) { const p = el("a", { href: viaProxy(url, name), download: name }); document.body.append(p); p.click(); p.remove(); return; }
  try { navigator.clipboard && navigator.clipboard.writeText(name); } catch (e) {}
  const a = el("a", { href: url, target: "_blank", rel: "noopener", download: name });
  document.body.append(a); a.click(); a.remove();
  status("سيرفر الفيديو يمنع المتصفح من قراءته (" + ((err && err.message) || "CORS") + ")، فبدأ التحميل بالاسم الأصلي. الاسم انتسخ للحافظة: " + name, true);
}

async function saveSub(url, name) {
  try {
    const r = await fetch(url); if (!r.ok) throw 0;
    let txt = (await r.text()).replace(/^\uFEFF/, "");
    if (/\.(srt|vtt)([?#]|$)/i.test(url)) {
      txt = txt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
      if (!/^\s*WEBVTT/.test(txt)) txt = "WEBVTT\n\n" + txt;
    }
    saveBlob(new Blob([txt], { type: "text/vtt;charset=utf-8" }), name);
    status("تم حفظ: " + name);
  } catch (e) { fallbackOpen(url, name, e); }
}

async function saveVideo(v, title, card, btn) {
  if (card._ctrl) { card._ctrl.abort(); return; }
  const baseName = clean(String(title || "Film")).replace(/\.(mp4|mkv|webm|mov|m4v)$/i, "").replace(/[. ]+$/, "") || "Film";
  const name = baseName + "." + v.ext;
  if (PROXY) return fallbackOpen(v.url, name);
  const ctrl = new AbortController(); card._ctrl = ctrl;
  const bar = card.querySelector(".bar"), fill = bar.firstChild, sub = card.querySelector(".sub");
  const subText = sub.textContent;
  bar.hidden = false; fill.style.width = "0%";
  btn.textContent = "إلغاء"; btn.classList.add("ghost");
  status("جاري التحميل...");
  let writable = null;
  try {
    const r = await fetch(v.url, { signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const total = +r.headers.get("content-length") || 0;
    if (window.showSaveFilePicker) {
      try {
        const mime = v.ext === "mp4" ? "video/mp4" : v.ext === "mkv" ? "video/x-matroska" : "application/octet-stream";
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: "Video", accept: { [mime]: ["." + v.ext] } }] });
        writable = await h.createWritable();
      } catch (e) {
        if (e && e.name === "AbortError") { ctrl.abort(); throw e; }
      }
    }
    const reader = r.body.getReader(); const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      got += value.length;
      if (writable) await writable.write(value); else parts.push(value);
      sub.textContent = total ? Math.round(got / total * 100) + "% · " + mb(got) + " / " + mb(total) : mb(got);
      if (total) fill.style.width = (got / total * 100) + "%";
    }
    if (writable) { await writable.close(); writable = null; }
    else saveBlob(new Blob(parts, { type: "video/" + (v.ext === "mkv" ? "x-matroska" : v.ext) }), name);
    status("تم حفظ: " + name);
  } catch (e) {
    if (writable) { try { await writable.abort(); } catch (_) {} }
    if (ctrl.signal.aborted) status("انلغى التحميل.");
    else fallbackOpen(v.url, name, e);
  } finally {
    card._ctrl = null; bar.hidden = true; sub.textContent = subText;
    btn.textContent = "تحميل الفيلم"; btn.classList.remove("ghost");
  }
}

// يعرف الدقة الحقيقية من الفيديو نفسه إذا البيانات ما ذكرتها
function probe(url) {
  return new Promise(res => {
    const v = document.createElement("video");
    const end = r => { clearTimeout(t); v.removeAttribute("src"); v.load(); res(r); };
    const t = setTimeout(() => end(null), 9000);
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => end(v.videoWidth ? { w: v.videoWidth, h: v.videoHeight } : null);
    v.onerror = () => end(null);
    v.src = url;
  });
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const out = $("out"), go = $("go"); out.replaceChildren();
  const id = ($("u").value.match(/\d+/g) || []).sort((a, b) => b.length - a.length)[0] || "";
  if (id.length < 4) return status("ما لكيت رقم الفيلم بالرابط.", true);
  status("جاري الجلب..."); go.disabled = true;
  try {
    const names = ["allVideoInfo", "transcoddedFiles", "translationFiles"];
    const res = await Promise.allSettled(names.map(n => grab(n, id)));
    const ok = res.filter(r => r.status === "fulfilled").map(r => r.value);
    if (!ok.length) return status("المتصفح منع الطلب أو سينمانا ما ردّت. جرّب مرة ثانية بعد شوية.", true);

    const { videos, subs } = classify(ok.flatMap(v => urlsIn(v.json, v.text)));
    const info = res[0].status === "fulfilled" ? res[0].value.json : null;
    let title = clean(findTitle(info)) || "Cinemana-" + id, kicker = "DETAILS";
    const poster = findPoster(info) || findPoster(ok.map(v => v.json));
    if (!videos.length) status("ما لكيت رابط فيديو قابل للتحميل. جرّب رابط فيلم أو حلقة ثانية.", true);
    else status("تم العثور على " + videos.length + " جودة" + (subs.length ? " و" + subs.length + " ترجمة" : "") + ".");

    const head = el("div", { className: "movie-head" });
    const img = el("img", { className: "poster", alt: "بوستر " + title, src: poster || "" });
    const noPoster = () => { img.removeAttribute("src"); img.classList.add("poster-placeholder"); img.alt = "لا يتوفر بوستر"; };
    if (!poster) noPoster();
    img.onerror = noPoster;
    head.append(img, el("div", {}, el("div", { className: "movie-kicker", textContent: kicker }), el("div", { className: "movie-name", textContent: title }), el("span", { className: "pill", textContent: "AXIS" })));
    out.append(head);

    const mkCard = (labelEl, subText, btn) => el("div", { className: "card" },
      el("div", {}, labelEl, el("div", { className: "sub", textContent: subText })), btn, el("div", { className: "bar", hidden: true }, el("i")));
    const labelOf = v => { const l = el("div", { className: "label" }, el("span", { textContent: v.label })); if (v.tag) l.append(el("span", { className: "tag", textContent: v.tag })); return l; };

    if (videos.length) {
      const list = el("div", { className: "list" });
      const items = videos.map(v => {
        const btn = el("button", { className: "mini", type: "button", textContent: "تحميل الفيلم" });
        const card = mkCard(labelOf(v), (v.sub ? v.sub + " · " : "") + v.ext.toUpperCase(), btn);
        btn.onclick = () => saveVideo(v, title, card, btn);
        return { v, card };
      });
      const sync = () => {
        const used = new Set();
        const keep = items.filter(i => { if (!i.v.n) return true; if (used.has(i.v.n)) { i.card.remove(); return false; } used.add(i.v.n); return true; });
        keep.sort((a, b) => b.v.n - a.v.n);
        list.append(...keep.map(i => i.card));
      };
      sync();
      out.append(el("div", { className: "group" }, el("h3", { textContent: "جودات الفيديو" }), list));
      // الجودات اللي ما انعرفت: نفحصها من الفيديو نفسه
      items.filter(i => !i.v.n).forEach(async i => {
        const r = await probe(i.v.url); if (!r) return;
        const t = tierOf(r); if (!t.n) return;
        Object.assign(i.v, t);
        i.card.querySelector(".label").replaceWith(labelOf(i.v));
        i.card.querySelector(".sub").textContent = (t.sub ? t.sub + " · " : "") + i.v.ext.toUpperCase();
        sync();
      });
    }

    if (subs.length) {
      out.append(el("div", { className: "group" }, el("h3", { textContent: "الترجمات" }), el("div", { className: "list" }, ...subs.map((s, i) => {
        const fname = title + (i ? "." + (s.code || i) : "") + (/^(vtt|srt)$/.test(s.ext) ? ".vtt" : "." + s.ext);
        const btn = el("button", { className: "mini", type: "button", textContent: "تحميل الترجمة", onclick: () => saveSub(s.url, fname) });
        return mkCard(el("div", { className: "label", textContent: s.lang }), "VTT", btn);
      }))));
    }
    if (!poster) out.append(el("div", { className: "note", textContent: "ما توفّر بوستر ضمن بيانات الفيلم." }));
  } finally { go.disabled = false; }
});
</script>
